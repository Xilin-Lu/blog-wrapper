<!doctype html>
<html lang="zh-CN">
<style>
  @font-face {
    font-family: "BlogBody";
    src: url("{{fontsUrl}}/body.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: "BlogCode";
    src: url("{{fontsUrl}}/code.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  body {
    font-family: "BlogBody", serif;
  }

  pre, code {
    font-family: "BlogCode", monospace;
  }

  main img {
    max-width: 100%;
    max-height: 50vh;
    width: auto;
    height: auto;
  }
</style>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <link rel="stylesheet" href="{{katexCss}}">
  <link rel="stylesheet" href="{{highlightCss}}">
</head>
<body>
  <nav aria-label="主导航", style="font-size: 1.3em;">
    <a href="{{homeUrl}}">主页</a>
    <a href="{{articlesUrl}}">文章列表</a>
    <a href="{{linksUrl}}">友链</a>
  </nav>
  <main>
{{body}}
  </main>
</body>
</html>
